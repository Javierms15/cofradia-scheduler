spring:
  application:
    name: cofradia-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/cofradia_scheduler
    username: cofradia
    password: cofradia
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: change-me-in-a-real-environment-please-use-a-long-random-secret
  expiration-ms: 86400000
